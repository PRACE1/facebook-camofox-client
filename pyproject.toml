[project]
name = "facebook-camofox-client"
version = "0.1.0"
description = "Camofox-native Facebook client for OpenMagpie"
requires-python = ">=3.11"
dependencies = [
    "camofox",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100
